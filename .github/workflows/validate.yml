name: Validate Transport Center sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate VBA and installer source
        run: python3 tests/check_project.py

# This workflow deliberately does not execute VBA or Excel.
# Full Excel COM tests require a separately provisioned Windows runner
# with a licensed Microsoft Excel installation.

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer and restore scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('deployment/AUTOINSTALL.ps1','deployment/offline-v6-route-write-fix.ps1','deployment/offline-v7-numeric-com-test.ps1','deployment/offline-v8-vba-access-preflight.ps1','deployment/offline-v9-save-close-verify.ps1','deployment/offline-v10.1/INSTALL_OFFLINE.ps1','deployment/offline-v10.2/INSTALL_OFFLINE.ps1','INSTALL.ps1','CATALOGS.ps1','RESTORE_BACKUP.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$path : " + $_.Message) }
              exit 1
            }
            Write-Host ("PowerShell grammar OK: " + $path)
          }
      - name: Test invariant Excel numeric formula conversion (PowerShell 5.1)
        shell: powershell
        run: .\\deployment\\offline-v7-numeric-com-test.ps1
      - name: Verify offline v10.1 Excel formula quoting
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'deployment/offline-v10.1/INSTALL_OFFLINE.ps1'
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ('Offline installer parse errors: '+$errors.Count) }
          $functions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'ExcelExpr' },$true))
          if ($functions.Count -ne 1) { throw 'Exactly one ExcelExpr function required' }
          Invoke-Expression $functions[0].Extent.Text
          $actual = ExcelExpr '=COUNTIF(~TC_Рейси~!$E$6:$E$50000,A6)'
          $expected = "=COUNTIF('TC_Рейси'!" + '$E$6:$E$50000,A6)'
          if ($actual -cne $expected) { throw ('Incorrect Excel formula: '+$actual) }
          Write-Host 'Formula quoting and complete installer grammar OK'
      - name: Validate offline v10.2 MSForms design-time API and v9 save order
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptText=[System.IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.2/INSTALL_OFFLINE.ps1').Path,[Text.Encoding]::UTF8)
          if ($scriptText.Contains('$designer.Width=') -or $scriptText.Contains('$designer.Height=')) { throw 'Direct Designer.Width/Height regression' }
          foreach($required in @(
             "$" + "uiComponent.Properties.Item('Width').Value=710",
             "$" + "uiComponent.Properties.Item('Height').Value=575",
             "$" + "probeForm.Properties.Item('Width').Value = 210",
             "$" + "probeControl.Move([single]12",
             "$" + "book.SaveAs($" + "target,52)",
             "$" + "book.Close($" + "false)"
          )) {
             if(-not $scriptText.Contains($required)) { throw ('Missing essential build operation: '+$required) }
          }
          Write-Host 'MSForms designer property path and v9 SaveAs/Close contract OK'
# Windows runner only validates PowerShell grammar; Excel is NOT installed/tested.
