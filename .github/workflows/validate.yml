name: Validate Transport Center sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate VBA and installer source
        run: python3 tests/check_project.py
      - name: Verify v10.6 modal list lifetime and modes
        run: python3 tests/check_v106_modal.py
      - name: Verify empty ComboBox IDs in v10.7
        run: python3 tests/check_v107_empty_id.py
      - name: Verify all/individual driver finance report and live status v10.8
        run: python3 tests/check_v108_reports.py

# This workflow deliberately does not execute VBA or Excel.
# Full Excel COM tests require a separately provisioned Windows runner
# with a licensed Microsoft Excel installation.

  powershell-parse:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer and restore scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('deployment/AUTOINSTALL.ps1','deployment/offline-v6-route-write-fix.ps1','deployment/offline-v7-numeric-com-test.ps1','deployment/offline-v8-vba-access-preflight.ps1','deployment/offline-v9-save-close-verify.ps1','deployment/offline-v10.1/INSTALL_OFFLINE.ps1','deployment/offline-v10.2/INSTALL_OFFLINE.ps1','deployment/offline-v10.3/INSTALL_OFFLINE.ps1','deployment/offline-v10.4/INSTALL_OFFLINE.ps1','deployment/offline-v10.8/INSTALL_OFFLINE.ps1','INSTALL.ps1','CATALOGS.ps1','RESTORE_BACKUP.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$path : " + $_.Message) }
              exit 1
            }
            Write-Host ("PowerShell grammar OK: " + $path)
          }
      - name: Test invariant Excel numeric formula conversion (PowerShell 5.1)
        shell: powershell
        run: .\\deployment\\offline-v7-numeric-com-test.ps1
      - name: Verify offline v10.1 Excel formula quoting
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'deployment/offline-v10.1/INSTALL_OFFLINE.ps1'
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw ('Offline installer parse errors: '+$errors.Count) }
          $functions = @($ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'ExcelExpr' },$true))
          if ($functions.Count -ne 1) { throw 'Exactly one ExcelExpr function required' }
          Invoke-Expression $functions[0].Extent.Text
          $actual = ExcelExpr '=COUNTIF(~TC_Рейси~!$E$6:$E$50000,A6)'
          $expected = "=COUNTIF('TC_Рейси'!" + '$E$6:$E$50000,A6)'
          if ($actual -cne $expected) { throw ('Incorrect Excel formula: '+$actual) }
          Write-Host 'Formula quoting and complete installer grammar OK'
      - name: Validate offline v10.2 MSForms design-time API and v9 save order
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptText=[System.IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.2/INSTALL_OFFLINE.ps1').Path,[Text.Encoding]::UTF8)
          if ($scriptText.Contains('$designer.Width=') -or $scriptText.Contains('$designer.Height=')) { throw 'Direct Designer.Width/Height regression' }
          $needles = @(
            '$uiComponent.Properties.Item(''Width'').Value=710'
            '$uiComponent.Properties.Item(''Height'').Value=575'
            '$probeForm.Properties.Item(''Width'').Value = 210'
            '$probeControl.Move([single]12'
            '$book.SaveAs($target,52)'
            '$book.Close($false)'
          )
          foreach($required in $needles) {
             if(-not $scriptText.Contains($required)) { throw ('Missing essential build operation: '+$required) }
          }
          Write-Host 'MSForms designer property path and v9 SaveAs/Close contract OK'
      - name: Check v10.3 dashboard anchors and modal controls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptText=[IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.3/INSTALL_OFFLINE.ps1').Path,[Text.Encoding]::UTF8)
          $vb=[IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.3/TransportApp.bas').Path,[Text.Encoding]::UTF8)
          foreach($required in @('DashboardButton $index','B17','F17','J17','N17','B22','F22','J22','N22','B27','F27','J27','N27')) {
            if(-not $scriptText.Contains($required)) { throw ('Missing anchored dashboard item: '+$required) }
          }
          foreach($required in @('f.Controls("cboDriver")','f.Controls("cmdSave")','initStage =','ApplyFormMode f')) {
            if(-not $vb.Contains($required)) { throw ('Missing VBA safety operation: '+$required) }
          }
          if($vb.Contains('f.cboDriver.')) { throw 'Unsupported late-bound control access regression' }
          if($scriptText.Contains('  Button $index ')) { throw 'Old unanchored dashboard control regression' }
          Write-Host 'Dashboard anchors and modal controls consistent'
      - name: Check v10.4 KPI card sizing and deferred MSForms initialization
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer=[IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.4/INSTALL_OFFLINE.ps1').Path,[Text.Encoding]::UTF8)
          $app=[IO.File]::ReadAllText((Resolve-Path 'deployment/offline-v10.4/TransportApp.bas').Path,[Text.Encoding]::UTF8)
          foreach($required in @('B8:D9','F8:H9','J8:L9','N8:P9','B12:D13','F12:H13','J12:L13','N12:P13','HorizontalAlignment=-4108','UserForm_Activate()','Private mInitialized As Boolean','If mInitialized Then Exit Sub','TC_FormInit Me')) {
            if(-not $installer.Contains($required)) {throw ('v10.4 layout/form regression: '+$required)}
          }
          if($installer.Contains('Private Sub UserForm_Initialize()')) {throw 'Old premature UserForm Initialize handler'}
          foreach($required in @('Set driverList = f.Controls.Item(','driverList.AddItem caption','driverLastRow =','If ws Is Nothing Then','initStage =')) {
            if(-not $app.Contains($required)) {throw ('v10.4 driver list regression: '+$required)}
          }
          Write-Host 'v10.4 KPI layout and deferred form lifecycle checks passed'
      - name: Check v10.5 workbook ownership before modal UI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p=(Resolve-Path 'deployment/offline-v10.5/TransportApp.bas').Path
          $vb=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8)
          $expected=@(
            'Private mHostBook As Workbook'
            'Set mHostBook = ThisWorkbook'
            'For Each candidate In mHostBook.Worksheets'
            'Set master = WS('
            'frmTCAdmin.Show vbModal'
            'Set ws = WS('
            'driverList.AddItem caption'
            'initStage ='
          )
          foreach($item in $expected) {
            if(-not $vb.Contains($item)) { throw ('Missing v10.5 VBA safety operation: '+$item) }
          }
          $probePos=$vb.IndexOf('Set master = WS(')
          $showPos=$vb.IndexOf('frmTCAdmin.Show vbModal')
          if($probePos -lt 0 -or $showPos -le $probePos) {throw 'Workbook lookup must precede showing the form'}
          if($vb.Contains('f.cboDriver.')) {throw 'Unsupported direct MSForms control reference'}
          Write-Host 'v10.5 host workbook lifetime and driver access checks passed'
# Windows runner only validates PowerShell grammar; Excel is NOT installed/tested.
